<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn∞Go - Centre de Formation Certifié</title>
    <!-- Tailwind CSS pour le style moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM pour l'interactivité -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel pour compiler le JSX en direct -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            scroll-behavior: smooth;
        }
        .bg-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        /**
         * Composant Icône corrigé pour Lucide
         * Utilise lucide.createIcons() pour transformer les attributs data-lucide en SVG
         */
        const LucideIcon = ({ name, className = "", size = 24 }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({
                        icons: window.lucide.icons,
                        attrs: {
                            class: className,
                            width: size,
                            height: size
                        }
                    });
                }
            }, [name, className, size]);

            // Formate le nom de l'icône de PascalCase vers kebab-case pour Lucide
            const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();

            return <i ref={iconRef} data-lucide={kebabName} className={className}></i>;
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const formations = [
                {
                    id: "crea-full",
                    title: "Conduire un projet de création ou de reprise d’entreprise",
                    code: "RS 7004",
                    desc: "Maîtrisez la méthodologie complète pour transformer votre idée en entreprise pérenne.",
                    features: ["Business Plan", "Étude de marché", "Statuts juridiques"],
                    icon: "rocket",
                    color: "bg-purple-100 text-purple-700"
                },
                {
                    id: "micro",
                    title: "Conduite d'un projet de création d'une micro entreprise",
                    code: "RS 7005",
                    desc: "La formation courte et efficace pour lancer votre micro-entreprise sans erreurs.",
                    features: ["Fiscalité simplifiée", "Gestion administrative", "Lancement"],
                    icon: "user-check",
                    color: "bg-blue-100 text-blue-700"
                },
                {
                    id: "compta",
                    title: "Réaliser les opérations comptables d'une TPE",
                    code: "RS 6485",
                    desc: "Gagnez en autonomie sur votre gestion financière et le pilotage de votre trésorerie.",
                    features: ["Saisie comptable", "Lecture de bilan", "Outils de gestion"],
                    icon: "calculator",
                    color: "bg-green-100 text-green-700"
                },
                {
                    id: "ia",
                    title: "Améliorer l'efficacité de sa TPE à l'aide de l'IA",
                    code: "RS 7311",
                    desc: "Exploitez les nouveaux outils d'IA pour automatiser vos tâches et gagner du temps.",
                    features: ["Prompt Engineering", "Outils productivité", "ChatGPT"],
                    icon: "zap",
                    color: "bg-orange-100 text-orange-700"
                },
                {
                    id: "social",
                    title: "Communiquer sur les réseaux sociaux (TPE)",
                    code: "RS 7200",
                    desc: "Développez votre visibilité et transformez vos abonnés en clients fidèles.",
                    features: ["Stratégie digitale", "Content Marketing", "Publicité"],
                    icon: "share-2",
                    color: "bg-pink-100 text-pink-700"
                }
            ];

            const HomePage = () => (
                <main className="animate-in fade-in duration-1000">
                    {/* Hero Section */}
                    <section className="relative pt-32 pb-20 lg:pt-48 lg:pb-32 px-6 overflow-hidden">
                        <div className="absolute top-0 right-0 -translate-y-1/2 translate-x-1/4 w-[600px] h-[600px] bg-purple-200 rounded-full blur-[120px] opacity-30"></div>
                        <div className="max-w-7xl mx-auto flex flex-col lg:flex-row items-center gap-16 relative z-10">
                            <div className="lg:w-1/2 text-center lg:text-left space-y-8">
                                <div className="inline-flex items-center gap-2 bg-orange-100 text-orange-700 px-4 py-2 rounded-full text-sm font-extrabold tracking-wide">
                                    <LucideIcon name="shield-check" size={16} /> CERTIFIÉ QUALIOPI & CPF
                                </div>
                                <h1 className="text-5xl lg:text-7xl font-extrabold text-slate-900 leading-[1.1]">
                                    Propulsez votre <span className="text-purple-700">avenir</span> avec Learn∞Go.
                                </h1>
                                <p className="text-xl text-slate-600 max-w-xl mx-auto lg:mx-0">
                                    Des formations concrètes, financées par vos droits à la formation, pour réussir vos projets entrepreneuriaux.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                                    <button 
                                        onClick={() => document.getElementById('catalog').scrollIntoView({behavior: 'smooth'})}
                                        className="bg-purple-700 hover:bg-purple-800 text-white px-8 py-5 rounded-2xl font-bold text-lg shadow-xl shadow-purple-200 flex items-center justify-center gap-2 transition-all active:scale-95"
                                    >
                                        Voir nos formations <LucideIcon name="arrow-right" size={20} />
                                    </button>
                                    <button 
                                        onClick={() => setCurrentPage('contact')}
                                        className="bg-white border-2 border-slate-200 hover:border-purple-600 text-slate-700 px-8 py-5 rounded-2xl font-bold text-lg transition-all"
                                    >
                                        Être rappelé
                                    </button>
                                </div>
                            </div>
                            <div className="lg:w-1/2 relative">
                                <div className="relative z-10 rounded-[2.5rem] overflow-hidden shadow-2xl border-8 border-white transform rotate-2">
                                    <img 
                                        src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2071&auto=format&fit=crop" 
                                        alt="Formation LearnGo" 
                                        className="w-full h-full object-cover"
                                    />
                                </div>
                                <div className="absolute -bottom-8 -left-8 bg-white p-6 rounded-3xl shadow-xl z-20 flex items-center gap-4">
                                    <div className="bg-green-100 p-3 rounded-2xl">
                                        <LucideIcon name="trending-up" className="text-green-600" />
                                    </div>
                                    <div>
                                        <p className="text-2xl font-black text-slate-900">98%</p>
                                        <p className="text-xs font-bold text-slate-500 uppercase">Satisfaction</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Logos Partners */}
                    <section className="py-12 border-y border-slate-100 bg-white">
                        <div className="max-w-7xl mx-auto px-6 flex flex-wrap justify-center items-center gap-16 grayscale opacity-40 hover:grayscale-0 hover:opacity-100 transition-all">
                            <img src="https://upload.wikimedia.org/wikipedia/fr/4/4c/Qualiopi.png" className="h-12" alt="Qualiopi" />
                            <div className="text-2xl font-black text-blue-900">MON COMPTE FORMATION</div>
                            <div className="text-lg font-bold text-slate-800">RÉPUBLIQUE FRANÇAISE</div>
                        </div>
                    </section>

                    {/* Catalog Section */}
                    <section id="catalog" className="py-24 bg-slate-50">
                        <div className="max-w-7xl mx-auto px-6 text-center mb-16 space-y-4">
                            <h2 className="text-4xl lg:text-5xl font-extrabold text-slate-900">Nos Formations</h2>
                            <p className="text-slate-600 max-w-2xl mx-auto">Choisissez le parcours qui correspond à vos objectifs et utilisez votre solde CPF.</p>
                        </div>
                        <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {formations.map((f) => (
                                <div key={f.id} className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col card-hover">
                                    <div className="flex justify-between items-start mb-6">
                                        <div className={`p-4 rounded-2xl ${f.color}`}>
                                            <LucideIcon name={f.icon} />
                                        </div>
                                        <span className="text-[10px] font-black uppercase bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full border border-slate-200">
                                            CODE {f.code}
                                        </span>
                                    </div>
                                    <h3 className="text-xl font-extrabold text-slate-900 mb-4 leading-tight">{f.title}</h3>
                                    <p className="text-slate-500 text-sm mb-6 flex-grow">{f.desc}</p>
                                    <ul className="space-y-3 mb-8">
                                        {f.features.map((item, idx) => (
                                            <li key={idx} className="flex items-center gap-3 text-sm font-medium text-slate-700">
                                                <LucideIcon name="check" size={16} className="text-purple-600" /> {item}
                                            </li>
                                        ))}
                                    </ul>
                                    <button 
                                        onClick={() => setCurrentPage('contact')}
                                        className="w-full py-4 rounded-xl bg-slate-900 text-white font-bold hover:bg-purple-700 transition-all flex items-center justify-center gap-2 group"
                                    >
                                        Je m'inscris <LucideIcon name="chevron-right" size={16} className="group-hover:translate-x-1 transition-transform" />
                                    </button>
                                </div>
                            ))}
                        </div>
                    </section>
                </main>
            );

            const ContactPage = () => (
                <div className="pt-32 pb-20 px-6 min-h-screen bg-slate-50 flex items-center justify-center animate-in slide-in-from-bottom-8 duration-700">
                    <div className="max-w-4xl w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row">
                        <div className="md:w-[40%] bg-purple-900 p-12 text-white flex flex-col justify-between">
                            <div>
                                <h2 className="text-3xl font-black mb-6">Contactez-nous</h2>
                                <p className="text-purple-200 leading-relaxed">Nous sommes disponibles pour vous aider dans vos démarches de financement.</p>
                            </div>
                            <div className="space-y-6">
                                <div className="flex items-center gap-4"><LucideIcon name="phone" className="text-orange-400" /> 01 23 45 67 89</div>
                                <div className="flex items-center gap-4"><LucideIcon name="mail" className="text-orange-400" /> contact@learngogo.fr</div>
                                <div className="flex items-center gap-4"><LucideIcon name="clock" className="text-orange-400" /> Réponse sous 24h</div>
                            </div>
                        </div>
                        <div className="md:w-[60%] p-12 lg:p-16">
                            <form className="space-y-6" onSubmit={(e) => { e.preventDefault(); alert('Message envoyé ! Nous vous recontactons très vite. 😊'); setCurrentPage('home'); }}>
                                <div className="grid sm:grid-cols-2 gap-6">
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-400 uppercase">Prénom</label>
                                        <input required type="text" className="w-full border-b-2 border-slate-100 py-3 focus:border-purple-600 outline-none transition-all" placeholder="Jean" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-400 uppercase">Nom</label>
                                        <input required type="text" className="w-full border-b-2 border-slate-100 py-3 focus:border-purple-600 outline-none transition-all" placeholder="Dupont" />
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-xs font-black text-slate-400 uppercase">Email</label>
                                    <input required type="email" className="w-full border-b-2 border-slate-100 py-3 focus:border-purple-600 outline-none transition-all" placeholder="jean@email.com" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-xs font-black text-slate-400 uppercase">Formation souhaitée</label>
                                    <select className="w-full border-b-2 border-slate-100 py-3 focus:border-purple-600 outline-none transition-all bg-white cursor-pointer">
                                        <option>Crea-Entreprise (RS 7004)</option>
                                        <option>Micro-Entreprise (RS 7005)</option>
                                        <option>Comptabilité TPE (RS 6485)</option>
                                        <option>Efficacité IA (RS 7311)</option>
                                        <option>Réseaux Sociaux (RS 7200)</option>
                                    </select>
                                </div>
                                <div className="pt-6">
                                    <button className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-orange-100 transition-all active:scale-95">
                                        DEMANDER MON RAPPEL
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="relative">
                    <nav className={`fixed top-0 left-0 right-0 z-[100] transition-all duration-300 ${isScrolled ? 'bg-glass shadow-lg py-4' : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => {setCurrentPage('home'); window.scrollTo(0,0);}}>
                                <div className="bg-purple-700 p-2 rounded-xl"><LucideIcon name="infinity" className="text-white" /></div>
                                <span className="text-2xl font-black tracking-tighter text-slate-900">LEARN<span className="text-orange-500 text-3xl leading-none">∞</span>GO</span>
                            </div>
                            <div className="hidden md:flex items-center gap-10 font-bold">
                                <button onClick={() => setCurrentPage('home')} className={`transition-colors ${currentPage === 'home' ? 'text-purple-700' : 'text-slate-600 hover:text-purple-700'}`}>Accueil</button>
                                <button onClick={() => {setCurrentPage('home'); setTimeout(() => document.getElementById('catalog').scrollIntoView({behavior: 'smooth'}), 100)}} className="text-slate-600 hover:text-purple-700">Formations</button>
                                <button onClick={() => setCurrentPage('contact')} className="bg-slate-950 text-white px-7 py-3 rounded-xl hover:bg-purple-700 transition-all">S'inscrire</button>
                            </div>
                        </div>
                    </nav>

                    {currentPage === 'home' ? <HomePage /> : <ContactPage />}

                    <footer className="bg-white pt-20 pb-12 px-6 border-t border-slate-100">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <div className="flex items-center gap-2">
                                <div className="bg-purple-100 p-1.5 rounded-lg"><LucideIcon name="infinity" className="text-purple-700" size={18} /></div>
                                <span className="font-black text-slate-900 uppercase tracking-widest text-sm">Learn∞Go</span>
                            </div>
                            <p className="text-slate-400 text-sm font-medium italic">"Par des entrepreneurs, pour des entrepreneurs."</p>
                            <div className="flex gap-8 text-sm font-bold text-slate-500">
                                <a href="#" className="hover:text-purple-700">Mentions</a>
                                <a href="#" className="hover:text-purple-700">RGPD</a>
                                <button onClick={() => setCurrentPage('contact')} className="text-orange-500">Contact</button>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto mt-12 pt-8 border-t border-slate-50 text-center text-xs text-slate-300">
                            © 2024 Learn∞Go Training Center. Tous droits réservés.
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
