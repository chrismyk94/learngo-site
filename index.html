<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn&GO - Centre de Formation Certifié</title>
    <!-- Tailwind CSS pour le style moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM pour l'interactivité -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel pour compiler le JSX en direct -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            scroll-behavior: smooth;
        }
        .bg-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
        }
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 30px -5px rgba(124, 58, 237, 0.08), 0 10px 15px -5px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Ajout de "memo" pour optimiser les composants
        const { useState, useEffect, useRef, memo } = React;
        
        /**
         * 1. EXTRACTION DES DONNÉES : Sorties du composant pour ne pas les recréer à chaque rendu
         */
        const formationsList = [
            {
                id: "crea-full",
                title: "Conduire un projet de création ou de reprise d’entreprise",
                code: "RS 7004",
                shortName: "Crea-Entreprise (RS 7004)",
                desc: "Maîtrisez la méthodologie complète pour transformer votre idée en entreprise pérenne.",
                features: ["Business Plan", "Étude de marché", "Statuts juridiques"],
                icon: "rocket",
                color: "bg-purple-100 text-purple-700"
            },
            {
                id: "micro",
                title: "Conduite d'un projet de création d'une micro entreprise",
                code: "RS 7005",
                shortName: "Micro-Entreprise (RS 7005)",
                desc: "La formation courte et efficace pour lancer votre micro-entreprise sans erreurs.",
                features: ["Fiscalité simplifiée", "Gestion administrative", "Lancement"],
                icon: "user-check",
                color: "bg-blue-100 text-blue-700"
            },
            {
                id: "compta",
                title: "Réaliser les opérations comptables d'une TPE",
                code: "RS 6485",
                shortName: "Comptabilité TPE (RS 6485)",
                desc: "Gagnez en autonomie sur votre gestion financière et le pilotage de votre trésorerie.",
                features: ["Saisie comptable", "Lecture de bilan", "Outils de gestion"],
                icon: "calculator",
                color: "bg-green-100 text-green-700"
            },
            {
                id: "ia",
                title: "Améliorer l'efficacité de sa TPE à l'aide de l'I.A",
                code: "RS 7311",
                shortName: "Efficacité IA (RS 7311)",
                desc: "Exploitez les nouveaux outils d'IA pour automatiser vos tâches et gagner du temps.",
                features: ["Prompt Engineering", "Outils productivité", "ChatGPT"],
                icon: "zap",
                color: "bg-orange-100 text-orange-700"
            },
            {
                id: "social",
                title: "Communiquer sur les réseaux sociaux pour promouvoir sa TPE",
                code: "RS 7200",
                shortName: "Réseaux Sociaux (RS 7200)",
                desc: "Développez votre visibilité et transformez vos abonnés en clients fidèles.",
                features: ["Stratégie digitale", "Content Marketing", "Publicité"],
                icon: "share-2",
                color: "bg-pink-100 text-pink-700"
            }
        ];

        /**
         * 2. MEMOIZATION : On empêche l'icône de se re-rendre inutilement
         */
        const LucideIcon = memo(({ name, className = "", size = 24 }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons({
                        icons: window.lucide.icons,
                        attrs: {
                            class: className,
                            width: size,
                            height: size
                        }
                    });
                }
            }, [name, className, size]);

            const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
            return <i ref={iconRef} data-lucide={kebabName} className={className}></i>;
        });

        /**
         * 3. ISOLATION : Le formulaire vit sa vie ici. Taper dedans ne recharge plus le reste du site !
         */
        const ContactSection = ({ defaultFormation }) => {
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [contactForm, setContactForm] = useState({
                firstName: '',
                lastName: '',
                email: '',
                formation: defaultFormation || 'Crea-Entreprise (RS 7004)'
            });

            // Met à jour la liste déroulante si l'utilisateur clique sur une formation depuis le catalogue
            useEffect(() => {
                if (defaultFormation) {
                    setContactForm(prev => ({...prev, formation: defaultFormation}));
                }
            }, [defaultFormation]);

            const handleFormSubmit = (e) => {
                e.preventDefault();
                setIsSubmitted(true);
                // On garde la formation sélectionnée, on vide juste les champs persos
                setContactForm(prev => ({
                    ...prev,
                    firstName: '',
                    lastName: '',
                    email: ''
                }));
            };

            return (
                <section id="contact" className="py-24 px-6 bg-slate-50 flex items-center justify-center">
                    <div className="max-w-4xl w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row">
                        <div className="md:w-[42%] bg-purple-900 p-12 text-white flex flex-col justify-between">
                            <div>
                                <h2 className="text-3xl font-black mb-6">Contactez-nous</h2>
                                <p className="text-purple-200 leading-relaxed mb-6">Nous sommes disponibles pour vous aider dans vos démarches de financement.</p>
                                
                                <div className="space-y-4 pt-4 border-t border-purple-800">
                                    <p className="font-semibold text-orange-400 text-sm uppercase tracking-wider">Une question avant de vous lancer ?</p>
                                    <p className="text-sm text-purple-200 leading-relaxed">Nos formations sont conçues pour être claires et accessibles immédiatement. Mais si vous avez besoin d'un accompagnement personnalisé, nous sommes à votre écoute.</p>
                                </div>
                            </div>
                            
                            <div className="space-y-4 py-6 border-t border-purple-800">
                                <div className="flex gap-4 justify-start items-center">
                                    <img src="assets/qualiopi.png" className="h-12 bg-white p-1 rounded-lg object-contain" alt="Qualiopi" />
                                    <img src="assets/mon compte formation.png" className="h-12 bg-white p-1 rounded-lg object-contain" alt="Mon Compte Formation" />
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="flex items-center gap-4"><LucideIcon name="phone" className="text-orange-400" /> 06 07 37 23 71</div>
                                <div className="flex items-center gap-4"><LucideIcon name="mail" className="text-orange-400" /> contact@learngoformation.fr</div>
                                <div className="flex items-center gap-4"><LucideIcon name="clock" className="text-orange-400" /> Réponse sous 24h</div>
                            </div>
                        </div>
                        
                        <div className="md:w-[58%] p-12 lg:p-16 flex flex-col justify-center">
                            {isSubmitted ? (
                                <div className="text-center space-y-6 animate-in zoom-in-95 duration-500">
                                    <div className="mx-auto bg-green-100 text-green-700 p-6 rounded-full w-24 h-24 flex items-center justify-center">
                                        <LucideIcon name="check" size={48} />
                                    </div>
                                    <h3 className="text-2xl font-extrabold text-slate-900">Demande envoyée !</h3>
                                    <p className="text-slate-600 leading-relaxed">
                                        Merci pour votre intérêt. Un conseiller spécialisé de l'équipe <strong>Learn&GO</strong> va vous recontacter d'ici les prochaines 24 heures. 😊
                                    </p>
                                    <a 
                                        href="#home"
                                        onClick={() => setIsSubmitted(false)}
                                        className="inline-block bg-purple-700 hover:bg-purple-800 text-white font-bold px-6 py-3 rounded-xl transition-all"
                                    >
                                        Retour à l'accueil
                                    </a>
                                </div>
                            ) : (
                                <form className="space-y-6" onSubmit={handleFormSubmit}>
                                    <div className="text-slate-900 space-y-2 mb-6">
                                        <h3 className="text-xl font-extrabold">Écrivez-nous, nous vous rappelons rapidement.</h3>
                                        <p className="text-sm text-slate-500">Sélectionnez votre intérêt et entrez vos coordonnées.</p>
                                    </div>
                                    
                                    <div className="grid sm:grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-400 uppercase">Prénom</label>
                                            <input 
                                                required 
                                                type="text" 
                                                className="w-full border-b-2 border-slate-100 py-3 focus:border-purple-600 outline-none transition-all font-semibold" 
                                                placeholder="Jean" 
                                                value={contactForm.firstName}
                                                onChange={(e) => setContactForm({...contactForm, firstName: e.target.value})}
                                            />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs font-black text-slate-400 uppercase">Nom</label>
                                            <input 
                                                required 
                                                type="text" 
                                                className="w-full border-b-2 border-slate-100 py-3 focus:border-purple-600 outline-none transition-all font-semibold" 
                                                placeholder="Dupont" 
                                                value={contactForm.lastName}
                                                onChange={(e) => setContactForm({...contactForm, lastName: e.target.value})}
                                            />
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-400 uppercase">Email</label>
                                        <input 
                                            required 
                                            type="email" 
                                            className="w-full border-b-2 border-slate-100 py-3 focus:border-purple-600 outline-none transition-all font-semibold" 
                                            placeholder="jean@email.com" 
                                            value={contactForm.email}
                                            onChange={(e) => setContactForm({...contactForm, email: e.target.value})}
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-400 uppercase">Formation souhaitée</label>
                                        <select 
                                            className="w-full border-b-2 border-slate-100 py-3 focus:border-purple-600 outline-none transition-all bg-white cursor-pointer font-semibold"
                                            value={contactForm.formation}
                                            onChange={(e) => setContactForm({...contactForm, formation: e.target.value})}
                                        >
                                            <option>Crea-Entreprise (RS 7004)</option>
                                            <option>Micro-Entreprise (RS 7005)</option>
                                            <option>Comptabilité TPE (RS 6485)</option>
                                            <option>Efficacité IA (RS 7311)</option>
                                            <option>Réseaux Sociaux (RS 7200)</option>
                                        </select>
                                    </div>
                                    
                                    <div className="pt-4 space-y-3">
                                        <div className="flex items-center gap-2 text-xs text-slate-500 font-semibold">
                                            <LucideIcon name="check" size={14} className="text-green-600" /> Nos formations sont éligibles au financement CPF
                                        </div>
                                        <div className="flex items-center gap-2 text-xs text-slate-500 font-semibold">
                                            <LucideIcon name="check" size={14} className="text-green-600" /> Inscription simple et rapide
                                        </div>
                                    </div>

                                    <div className="pt-4">
                                        <button className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-orange-100 transition-all active:scale-95 text-base tracking-wide">
                                            DEMANDER MON RAPPEL
                                        </button>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                </section>
            );
        };

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [targetFormation, setTargetFormation] = useState('');

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="relative">
                    {/* Header bar */}
                    <nav className={`fixed top-0 left-0 right-0 z-[100] transition-all duration-300 ${isScrolled ? 'bg-glass shadow-lg py-5' : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <a href="#home" className="flex items-center gap-3 cursor-pointer">
                                <img src="assets/logo learn&go.png" alt="Learn&GO" className="h-16 md:h-20 w-auto object-contain hover:scale-102 transition-transform" />
                            </a>
                            <div className="hidden md:flex items-center gap-10 font-bold">
                                <a href="#home" className="text-slate-600 hover:text-purple-700 transition-colors">Accueil</a>
                                <a href="#catalog" className="text-slate-600 hover:text-purple-700 transition-colors">Formations</a>
                                <a href="#contact" className="bg-slate-950 text-white px-8 py-4 rounded-xl hover:bg-purple-700 transition-all shadow-md">S'inscrire / Contact</a>
                            </div>
                        </div>
                    </nav>

                    <main id="home" className="animate-in fade-in duration-1000">
                        {/* Hero Section */}
                        <section className="relative pt-36 pb-20 lg:pt-52 lg:pb-32 px-6 overflow-hidden">
                            <div className="absolute top-0 right-0 -translate-y-1/2 translate-x-1/4 w-[600px] h-[600px] bg-purple-200 rounded-full blur-[120px] opacity-30"></div>
                            <div className="max-w-7xl mx-auto flex flex-col lg:flex-row items-center gap-16 relative z-10">
                                <div className="lg:w-1/2 text-center lg:text-left space-y-8">
                                    <div className="inline-flex items-center gap-2 bg-orange-100 text-orange-700 px-4 py-2 rounded-full text-sm font-extrabold tracking-wide">
                                        <LucideIcon name="shield-check" size={16} /> CERTIFIÉ QUALIOPI & CPF
                                    </div>
                                    <h1 className="text-5xl lg:text-7.5xl font-extrabold text-slate-900 leading-[1.1] tracking-tight">
                                        Propulsez votre <span className="text-purple-700">avenir</span> avec Learn&GO.
                                    </h1>
                                    <p className="text-xl text-slate-600 max-w-xl mx-auto lg:mx-0 leading-relaxed">
                                        Des formations concrètes, financées par vos droits à la formation, pour réussir vos projets entrepreneuriaux.
                                    </p>
                                    <div className="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                                        <a href="#catalog" className="bg-purple-700 hover:bg-purple-800 text-white px-8 py-5 rounded-2xl font-bold text-lg shadow-xl shadow-purple-200 flex items-center justify-center gap-2 transition-all active:scale-95 hover:scale-102 inline-flex">
                                            Voir nos formations <LucideIcon name="arrow-right" size={20} />
                                        </a>
                                        <a href="#contact" className="bg-white border-2 border-slate-200 hover:border-purple-600 text-slate-700 px-8 py-5 rounded-2xl font-bold text-lg transition-all text-center inline-flex items-center justify-center">
                                            Être rappelé
                                        </a>
                                    </div>
                                </div>
                                <div className="lg:w-1/2 relative">
                                    <div className="relative z-10 rounded-[2.5rem] overflow-hidden shadow-2xl border-8 border-white transform rotate-2 hover:rotate-0 transition-transform duration-500">
                                        <img 
                                            src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2071&auto=format&fit=crop" 
                                            alt="Formation Learn&GO" 
                                            className="w-full h-full object-cover"
                                        />
                                    </div>
                                    <div className="absolute -bottom-8 -left-8 bg-white p-6 rounded-3xl shadow-xl z-20 flex items-center gap-4">
                                        <div className="bg-green-100 p-3 rounded-2xl">
                                            <LucideIcon name="trending-up" className="text-green-600" />
                                        </div>
                                        <div>
                                            <p className="text-2xl font-black text-slate-900">98%</p>
                                            <p className="text-xs font-bold text-slate-500 uppercase">Satisfaction</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Logos Partners */}
                        <section className="py-16 border-y border-slate-100 bg-white">
                            <div className="max-w-7xl mx-auto px-6 flex flex-wrap justify-center items-center gap-16 md:gap-24 transition-all">
                                <img src="assets/qualiopi.png" className="h-20 md:h-24 w-auto object-contain hover:scale-105 transition-transform" alt="Qualiopi" />
                                <img src="assets/mon compte formation.png" className="h-20 md:h-24 w-auto object-contain hover:scale-105 transition-transform" alt="Mon Compte Formation" />
                                <img src="assets/RF.png" className="h-20 md:h-24 w-auto object-contain hover:scale-105 transition-transform" alt="République Française" />
                            </div>
                        </section>

                        {/* Catalog Section */}
                        <section id="catalog" className="py-24 bg-slate-50">
                            <div className="max-w-7xl mx-auto px-6 text-center mb-16 space-y-4">
                                <h2 className="text-4xl lg:text-5xl font-extrabold text-slate-900">Nos Formations</h2>
                                <p className="text-slate-600 max-w-2xl mx-auto text-lg">Choisissez le parcours qui correspond à vos objectifs et utilisez votre solde CPF.</p>
                            </div>
                            <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {formationsList.map((f) => (
                                    <div key={f.id} className="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col card-hover">
                                        <div className="flex justify-between items-start mb-6">
                                            <div className={`p-4 rounded-2xl ${f.color}`}>
                                                <LucideIcon name={f.icon} />
                                            </div>
                                            <span className="text-[10px] font-black uppercase bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full border border-slate-200">
                                                CODE {f.code}
                                            </span>
                                        </div>
                                        <h3 className="text-xl font-extrabold text-slate-900 mb-4 leading-tight">{f.title}</h3>
                                        <p className="text-slate-500 text-sm mb-6 flex-grow leading-relaxed">{f.desc}</p>
                                        <ul className="space-y-3 mb-8">
                                            {f.features.map((item, idx) => (
                                                <li key={idx} className="flex items-center gap-3 text-sm font-semibold text-slate-700">
                                                    <LucideIcon name="check" size={16} className="text-purple-600" /> {item}
                                                </li>
                                            ))}
                                        </ul>
                                       
                                        <a 
                                            href="#contact"
                                            onClick={() => setTargetFormation(f.shortName)}
                                            className="w-full py-4 rounded-xl bg-slate-900 text-white font-bold hover:bg-purple-700 transition-all flex items-center justify-center gap-2 group"
                                        >
                                            Je m'inscris <LucideIcon name="chevron-right" size={16} className="group-hover:translate-x-1 transition-transform" />
                                        </a>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* CTA Section */}
                        <section className="bg-purple-900 py-24 text-white px-6">
                            <div className="max-w-5xl mx-auto text-center space-y-8">
                                <h2 className="text-3xl md:text-5xl font-extrabold leading-tight">Prêt à passer à l'action ?</h2>
                                <p className="text-purple-200 max-w-xl mx-auto text-lg leading-relaxed">
                                    Découvrez nos parcours de formation financés et commencez à construire votre avenir professionnel dès aujourd'hui.
                                </p>
                                <div className="flex flex-col sm:flex-row justify-center gap-4">
                                    <a 
                                        href="#contact"
                                        className="bg-orange-500 hover:bg-orange-600 text-white font-extrabold px-8 py-4 rounded-2xl shadow-xl transition-all active:scale-95 text-lg inline-block"
                                    >
                                        Être rappelé gratuitement
                                    </a>
                                </div>
                                
                                <div className="flex flex-wrap justify-center items-center gap-10 pt-12 opacity-95">
                                    <img src="assets/qualiopi.png" className="h-16 md:h-20 bg-white p-1.5 rounded-xl object-contain shadow-lg" alt="Qualiopi" />
                                    <img src="assets/mon compte formation.png" className="h-16 md:h-20 bg-white p-1.5 rounded-xl object-contain shadow-lg" alt="Mon Compte Formation" />
                                    <img src="assets/RF.png" className="h-16 md:h-20 bg-white p-1.5 rounded-xl object-contain shadow-lg" alt="République Française" />
                                </div>
                            </div>
                        </section>

                        {/* Composant Isolé : le formulaire */}
                        <ContactSection defaultFormation={targetFormation} />
                        
                    </main>

                    {/* Footer with branding */}
                    <footer className="bg-white pt-24 pb-12 px-6 border-t border-slate-100">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-10">
                            <div className="flex items-center gap-2">
                                <img src="assets/logo learn&go.png" alt="Learn&GO" className="h-12 md:h-14 w-auto object-contain" />
                            </div>
                            <p className="text-slate-400 text-sm font-medium italic">"Par des entrepreneurs, pour des entrepreneurs."</p>

                            <div className="flex gap-8 text-sm font-bold text-slate-500">
                                <a href="#" className="hover:text-purple-700">Mentions</a>
                                <a href="#" className="hover:text-purple-700">RGPD</a>
                                <a href="#contact" className="text-orange-500 font-bold hover:underline">Contact</a>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto mt-12 pt-8 border-t border-slate-50 text-center text-xs text-slate-300">
                            © 2026 Learn&GO Training Center. Tous droits réservés.
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
